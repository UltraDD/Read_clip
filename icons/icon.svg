  </defs>
  
  <!-- Background rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Document/Page shape -->
  <path d="M40 28 L76 28 L88 40 L88 92 C88 96 85 100 80 100 L48 100 C43 100 40 96 40 92 L40 28 Z" 

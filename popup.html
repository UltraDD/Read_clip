<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Clip</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="ambient-mesh">
    <div class="mesh-orb orb-1"></div>
    <div class="mesh-orb orb-2"></div>
  </div>

  <nav class="nav-bar">
    <div class="brand">
      <span class="app-icon">📎</span>
      <span class="brand-name">Read Clip</span>
    </div>
    <div class="nav-actions">
      <button id="btn-open-manager" class="icon-btn" title="管理后台">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
      </button>
    </div>
  </nav>

  <main class="content-area">
    <div class="top-action-section">
      <div id="action-capsule" class="capsule static-capsule">
        <div class="capsule-content state-idle">
          <span class="capsule-icon">📥</span>
          <span class="capsule-text">剪藏并推送</span>
        </div>
        <div class="capsule-content state-processing" style="display: none;">
          <div class="spinner"></div>
          <span class="capsule-text" id="progress-text">处理中...</span>
          <button class="capsule-btn stop-btn" id="btn-stop" title="停止">✕</button>
        </div>
        <div class="capsule-content state-success" style="display: none;">
          <span class="success-icon">✓</span>
          <span class="capsule-text">已推送</span>
          <div class="divider-vertical"></div>
          <button class="capsule-btn" id="btn-open-github" title="在 GitHub 查看">🐙 查看</button>
        </div>
        <div class="capsule-content state-error" style="display: none;">
          <span class="capsule-text">❌ 失败</span>
        </div>
      </div>

      <div id="progress-steps" class="progress-steps" style="display: none;">
        <div class="step-item" data-step="extract">
          <span class="step-status">○</span>
          <div class="step-content">
            <span class="step-label">解析页面内容</span>
            <div class="step-detail"></div>
          </div>
        </div>
        <div class="step-item" data-step="oss">
          <span class="step-status">○</span>
          <div class="step-content">
            <span class="step-label">图片转存（OSS）</span>
            <div class="step-detail"></div>
          </div>
        </div>
        <div class="step-item" data-step="ai">
          <span class="step-status">○</span>
          <div class="step-content">
            <span class="step-label">DeepSeek 总结</span>
            <div class="step-detail"></div>
          </div>
        </div>
        <div class="step-item" data-step="github">
          <span class="step-status">○</span>
          <div class="step-content">
            <span class="step-label">推送到 GitHub</span>
            <div class="step-detail"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="section-header">
      <span class="section-label">最近剪藏</span>
    </div>
    <ul id="history-list" class="ios-list">
      <li class="empty-state">
        <div class="empty-icon">📭</div>
        <p>暂无记录</p>
      </li>
    </ul>
    <div style="height: 20px;"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
